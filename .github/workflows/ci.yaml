name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

# Cancel a superseded run when new commits land on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      example: ${{ steps.filter.outputs.example }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # docs/ is the documentation site. It is not built here; see
            # pages.yaml.
            code:
              - 'puppy-lib/**'
              - 'puppy-runtime/**'
              - 'cli/**'
              - 'fixture/**'
              - 'spago.yaml'
              - 'spago.lock'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/ci.yaml'
            # The PureScript grammar. Built by the `stress` job below, not the
            # one above.
            example:
              - 'example/**'

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: katsujukou-github
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - uses: nicknovitski/nix-develop@v1

      # Named rather than a bare `spago build`, which would also take in the
      # documentation site. Between them these four reach every package that
      # ships.
      - name: Build
        run: |
          for package in puppy-runtime puppy-lib puppy-cli puppy-fixture; do
            spago build -p "$package" --strict --pure --pedantic-packages
          done

      - name: Test lib & cli packages
        run: |
          spago test -p puppy-lib -m Test.Puppy --pure
          spago test -p puppy-cli -m Test.Puppy.CLI.Main --pure

      # The parsers under fixture/src are the generator's own output, kept in
      # the tree so that this compiles and runs them for real. A golden test on
      # the generated text could only say it had not changed.
      - name: Test generated parsers
        run: spago test -p puppy-fixture --pure

      # Regenerating has to be a no-op, or the committed parsers no longer say
      # what the generator does. Runs before the step below, which removes the
      # output the CLI is built from.
      - name: Fixtures are current
        run: |
          spago run -p puppy-cli --pure -- -p puppy-fixture
          git diff --exit-code fixture/src

      - name: Build & Test runtime (in clean environment)
        run: |
          rm -rf .spago output
          spago build -p puppy-runtime --strict
          spago test -p puppy-runtime --pure

      - name: Format check
        run: git ls-files '*.purs' ':(exclude)docs/**' | xargs purs-tidy check

  # The PureScript grammar under example/ is a real grammar regression test: 641
  # states, 396 productions and every `%shift` site the port needed. It is kept
  # out of the job above so that a change to it cannot hold up the packages
  # that ship, and run here so that it cannot quietly stop working either.
  stress:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.example == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: katsujukou-github
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - uses: nicknovitski/nix-develop@v1

      # No `--allow-conflicts`. Every conflict this grammar has is one it
      # settles, and a new one should stop the build.
      #
      # `--emit-explain` writes a report when something is left unsettled and
      # removes a stale one when nothing is, so a report left behind by an
      # earlier state of the grammar shows up in the diff below rather than
      # sitting in the tree contradicting it.
      - name: Generate the PureScript parser
        run: |
          spago run -p puppy-cli --pure -- \
            example/purescript/src/Puppy/Purs/Parser.pursy \
            -m Puppy.Purs.Parser \
            -o example/purescript/src/Puppy/Purs/Parser.purs \
            --emit-explain

      - name: The committed parser is current
        run: git diff --exit-code example/purescript/src

      - name: Compile and run it
        run: spago test -p puppy-example-purescript --pure

  ps-ci-gate:
    needs: [changes, ci, stress]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # A skipped job is not a passing one unless the filter meant to skip it.
      # `changes` is what decides that, so it has to have run: if it failed,
      # both jobs below are skipped for a reason that has nothing to do with
      # the code, and a gate that only looks for `failure` would wave it
      # through.
      - name: Gate on the results
        run: |
          changes='${{ needs.changes.result }}'
          if [ "$changes" != "success" ]; then
            echo "::error::changes did not pass (result: $changes)"
            exit 1
          fi

          code='${{ needs.changes.outputs.code }}'
          example='${{ needs.changes.outputs.example }}'
          ci='${{ needs.ci.result }}'
          stress='${{ needs.stress.result }}'

          if [ "$code" = "true" ] && [ "$ci" != "success" ]; then
            echo "::error::ci did not pass (result: $ci)"
            exit 1
          fi

          if { [ "$code" = "true" ] || [ "$example" = "true" ]; } \
            && [ "$stress" != "success" ]; then
            echo "::error::stress did not pass (result: $stress)"
            exit 1
          fi

          echo "CI gate green (code=$code example=$example ci=$ci stress=$stress)"
