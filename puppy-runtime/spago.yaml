package:
  name: puppy-runtime
  description: The runtime (table driver) for parsers generated by Puppy.
  publish:
    version: 0.2.0
    license: MIT
    location:
      githubOwner: katsujukou
      githubRepo: puppy
      subdir: puppy-runtime
  dependencies:
    - arrays
    - either
    - lists
    - maybe
    - partial
    - prelude
    - tailrec
    - transformers
    - tuples
    - unsafe-coerce
  test:
    main: Test.Puppy.Runtime
    dependencies:
      - spec
      - spec-node
      - effect
      - datetime
      - now
      - partial
      - refs
      - strings
      - transformers
      - tuples
