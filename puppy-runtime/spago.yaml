package:
  name: puppy-runtime
  description: The runtime (table driver) for parsers generated by Puppy.
  publish:
    version: 0.2.0
    license: MIT
    location:
      githubOwner: katsujukou
      githubRepo: puppy
      subdir: puppy-runtime
  dependencies:
    - arrays: ">=7.3.0 <8.0.0"
    - either: ">=6.1.0 <7.0.0"
    - lists: ">=7.0.0 <8.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - partial: ">=4.0.0 <5.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - tailrec: ">=6.1.0 <7.0.0"
    - transformers: ">=6.1.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - unsafe-coerce: ">=6.0.0 <7.0.0"
  test:
    main: Test.Puppy.Runtime
    dependencies:
      - spec
      - spec-node
      - effect
      - datetime
      - now
      - partial
      - refs
      - strings
      - transformers
      - tuples
