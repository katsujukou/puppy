<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Puppy — PureScript LR(1) parser generator emblem</title>
  <desc id="desc">A geometric puppy face with PureScript-inspired chevrons and a parser tree forming its muzzle.</desc>

  <defs>
    <linearGradient id="badge" x1="96" y1="64" x2="416" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#242044"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="violet" x1="146" y1="126" x2="370" y2="368" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9678F0"/>
      <stop offset="1" stop-color="#6242C7"/>
    </linearGradient>
    <linearGradient id="ear" x1="92" y1="138" x2="177" y2="281" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B69BFF"/>
      <stop offset="1" stop-color="#7452D6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#090C16" flood-opacity=".38"/>
    </filter>
    <clipPath id="badgeClip">
      <circle cx="256" cy="256" r="220"/>
    </clipPath>
  </defs>

  <!-- Deep circular field: calm enough for documentation, strong enough for a CLI icon. -->
  <circle cx="256" cy="256" r="232" fill="url(#badge)"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="2"/>

  <!-- Subtle automaton orbit and state markers. -->
  <g clip-path="url(#badgeClip)" fill="none" stroke="#B69BFF" stroke-linecap="round">
    <path d="M100 326A178 178 0 0 1 108 169" stroke-opacity=".18" stroke-width="3" stroke-dasharray="2 13"/>
    <path d="M404 169A178 178 0 0 1 412 326" stroke-opacity=".18" stroke-width="3" stroke-dasharray="2 13"/>
  </g>

  <g filter="url(#shadow)">
    <!-- Floppy ears, drawn as soft geometric brackets. -->
    <path d="M165 150C133 122 93 126 76 154C64 174 70 202 92 224L143 276L177 215Z" fill="url(#ear)"/>
    <path d="M347 150C379 122 419 126 436 154C448 174 442 202 420 224L369 276L335 215Z" fill="url(#ear)"/>
    <path d="M151 163C128 145 104 148 93 165C84 179 90 195 103 208L145 250L163 205Z" fill="#2D2853" fill-opacity=".72"/>
    <path d="M361 163C384 145 408 148 419 165C428 179 422 195 409 208L367 250L349 205Z" fill="#2D2853" fill-opacity=".72"/>

    <!-- Head: a rounded shield silhouette, friendly but precise. -->
    <path d="M256 107C191 107 145 153 145 222V287C145 355 191 405 256 405C321 405 367 355 367 287V222C367 153 321 107 256 107Z" fill="#F8F5EE"/>
    <path d="M256 107C191 107 145 153 145 222V287C145 355 191 405 256 405C321 405 367 355 367 287V222C367 153 321 107 256 107Z" fill="none" stroke="#FFFFFF" stroke-opacity=".58" stroke-width="3"/>

    <!-- PureScript-inspired token flow: opposing chevrons around a shared production. -->
    <g fill="none" stroke="url(#violet)" stroke-linecap="round" stroke-linejoin="round" stroke-width="14">
      <path d="M225 162L203 184L225 206"/>
      <path d="M287 162L309 184L287 206"/>
      <path d="M236 184H276"/>
    </g>
    <circle cx="326" cy="184" r="8" fill="#F3C969"/>

    <!-- Eyes. -->
    <ellipse cx="210" cy="239" rx="11" ry="14" fill="#1A2031"/>
    <ellipse cx="302" cy="239" rx="11" ry="14" fill="#1A2031"/>
    <circle cx="207" cy="235" r="3" fill="#FFFFFF" fill-opacity=".86"/>
    <circle cx="299" cy="235" r="3" fill="#FFFFFF" fill-opacity=".86"/>

    <!-- Muzzle. The nose is the parser root; its mouth resolves into an AST. -->
    <path d="M190 292C190 263 218 247 256 247C294 247 322 263 322 292C322 330 293 355 256 355C219 355 190 330 190 292Z" fill="#FFFFFF"/>
    <path d="M234 273C234 263 244 258 256 258C268 258 278 263 278 273C278 284 267 292 256 292C245 292 234 284 234 273Z" fill="#181D2B"/>

    <g fill="none" stroke="#7452D6" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
      <path d="M256 292V307"/>
      <path d="M256 307L225 330"/>
      <path d="M256 307L287 330"/>
    </g>
    <circle cx="225" cy="330" r="9" fill="#7452D6"/>
    <circle cx="287" cy="330" r="9" fill="#42B5C7"/>
    <circle cx="256" cy="307" r="6" fill="#181D2B"/>
  </g>

  <!-- Three compact grammar tokens anchor the mark without adding text. -->
  <g transform="translate(0 2)">
    <rect x="184" y="419" width="36" height="7" rx="3.5" fill="#9678F0"/>
    <rect x="238" y="419" width="36" height="7" rx="3.5" fill="#42B5C7"/>
    <rect x="292" y="419" width="36" height="7" rx="3.5" fill="#F3C969"/>
  </g>
</svg>
